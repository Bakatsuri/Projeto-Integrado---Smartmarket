<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0daa4f">
  <title>Erro: {{ error }}</title>

  <style>
    :root {
      --primary: #292b2a;
      --primary-dark: #0cb17a;
      --background: #6e6b65;
      --surface: #0daa4f;
      --text: #202923;
      --muted: #ffffff;
      --border: #e1e8e3;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--background);
      line-height: 1.5;
    }

    button,
    input {
      font: inherit;
    }

    .topnav {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 1rem;
      min-height: 68px;
      padding: 0 max(5%, calc((100% - 1120px) / 2));
      background: var(--surface);
      box-shadow: 0 2px 12px rgb(0 0 0 / 5%);
    }

    .brand {
      flex-shrink: 0;
      color: var(--primary);
      font-size: 1.3rem;
      font-weight: 800;
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex: 1;
    }

    .home-link {
      color: var(--text);
      font-weight: 600;
      text-decoration: none;
    }

    .home-link:hover {
      color: var(--primary);
    }

    .search-form {
      display: flex;
      width: min(100%, 360px);
      margin-left: auto;
    }

    .search-form input {
      width: 100%;
      min-width: 0;
      padding: 0.7rem 0.85rem;
      border: 1px solid var(--border);
      border-right: 0;
      border-radius: 9px 0 0 9px;
      outline-offset: 2px;
      background: #fafcfb;
      color: var(--text);
    }

    .search-form input:focus {
      border-color: var(--primary);
      outline: none;
    }

    .search-form button {
      display: grid;
      place-items: center;
      flex-shrink: 0;
      width: 46px;
      border: 0;
      border-radius: 0 9px 9px 0;
      background: var(--primary);
      color: var(--muted);
      cursor: pointer;
    }

    .search-form button:hover {
      background: var(--primary-dark);
    }

    .search-form svg {
      width: 20px;
      height: 20px;
    }

    .menu-toggle {
      display: none;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--primary);
      cursor: pointer;
    }

    .menu-toggle:hover {
      background: var(--background);
    }

    .menu-toggle svg {
      width: 24px;
      height: 24px;
    }

    main {
      width: min(100% - 32px, 1040px);
      min-height: calc(100vh - 68px);
      min-height: calc(100dvh - 68px);
      margin: 0 auto;
      padding: 36px 0 56px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .error-card {
      width: 100%;
      max-width: 560px;
      margin: 30px auto;
      padding: clamp(24px, 5vw, 40px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      text-align: center;
    }

    .error-card h1 {
      margin: 0 0 16px;
      color: var(--primary);
      font-size: clamp(2rem, 8vw, 4rem);
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .error-card p {
      margin: 0;
      color: var(--text);
      font-size: clamp(1rem, 3vw, 1.2rem);
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .footer {
      padding: 20px;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }

    @media (max-width: 700px) {
      .topnav {
        min-height: 62px;
        gap: 8px;
        padding: 8px 16px;
      }

      .brand {
        font-size: 1.15rem;
      }

      .menu-toggle {
        display: grid;
        flex-shrink: 0;
        margin-left: auto;
      }

      .nav-links {
        position: absolute;
        top: 100%;
        right: 0;
        left: 0;
        display: none;
        align-items: stretch;
        flex-direction: column;
        gap: 16px;
        padding: 18px 16px;
        border-top: 1px solid var(--border);
        background: var(--surface);
        box-shadow: 0 8px 14px rgb(0 0 0 / 8%);
      }

      .nav-links.open {
        display: flex;
      }

      .search-form {
        width: 100%;
        margin: 0;
      }

      main {
        width: min(100% - 24px, 520px);
        padding-top: 24px;
      }

      .error-card {
        margin: 20px auto;
      }
    }
  </style>
</head>

<body>
  <nav class="topnav" aria-label="Navegação principal">
    <a class="brand" href="/">SmartMarket</a>

    <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="nav-links">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>

    <div class="nav-links" id="nav-links">

      <form class="search-form" action="{{ url_for('produto.produto') }}" method="get" role="search">
        <input type="search" name="q" placeholder="Pesquisar produto..." aria-label="Pesquisar produto">

        <button type="submit" aria-label="Pesquisar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5"></circle>
            <path d="m16 16 5 5"></path>
          </svg>
        </button>
      </form>
    </div>
  </nav>

  <main>
    <section class="error-card">
      <h1>Erro {{ error }}</h1>
      <p>{{ descricao }}</p>
    </section>
  </main>

  <footer class="footer">
    SmartMarket
  </footer>

  <script>
    const menuToggle = document.querySelector(".menu-toggle");
    const navLinks = document.querySelector(".nav-links");

    if (menuToggle && navLinks) {
      menuToggle.addEventListener("click", () => {
        const isOpen = navLinks.classList.toggle("open");

        menuToggle.setAttribute("aria-expanded", String(isOpen));
        menuToggle.setAttribute(
          "aria-label",
          isOpen ? "Fechar menu" : "Abrir menu"
        );
      });
    }
  </script>
</body>

</html>
